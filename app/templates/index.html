<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hearth</title>
  <link rel="icon" href="/static/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-mark" src="/static/logo.png" alt="" width="32" height="32" />
      <span class="brand-name">Hearth</span>
    </div>
    <div class="sidebar-top">
      <button class="new-chat" id="new-chat" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        New chat
      </button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search chats" autocomplete="off" />
    <nav class="chat-list" id="chat-list" aria-label="Chat history"></nav>
    <div class="sidebar-foot">
      <button class="icon-btn collapse" id="collapse-sidebar" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <rect x="2.5" y="3.5" width="5" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
          <rect x="10.5" y="3.5" width="5" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="column">
      <header class="toolbar">
        <button class="icon-btn reopen" id="reopen-sidebar" type="button" title="Open sidebar" aria-label="Open sidebar" hidden>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <rect x="2.5" y="3.5" width="5" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
            <rect x="10.5" y="3.5" width="5" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
        <label class="sr-only" for="model">Model</label>
        <select id="model" class="model-select"></select>
        <label class="toggle-wrap" id="think-wrap" hidden>
          <input type="checkbox" id="thinking" checked />
          <span>Thinking</span>
        </label>
        <label class="effort-wrap" id="effort-wrap" hidden>
          <span class="sr-only">Effort</span>
          <select id="effort" class="effort-select"></select>
        </label>
      </header>

      <p class="banner" id="banner" hidden></p>

      <section class="thread" id="thread" aria-live="polite">
        <div class="empty" id="empty">
          <img class="empty-mark" src="/static/logo.png" alt="" width="56" height="56" />
          <h1>Hearth is ready</h1>
          <p>Your models stay on this machine. Ask anything.</p>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="chips" id="chips"></div>
        <div class="composer-row">
          <button class="icon-btn attach" id="attach-btn" type="button" title="Attach files" aria-label="Attach files">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M9 3.5v11M3.5 9h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <textarea id="prompt" rows="1" placeholder="Write a message…" autocomplete="off"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" title="Send">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 12.5V3.5M8 3.5 4 7.5M8 3.5l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <input id="file-input" type="file" multiple hidden
          accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.tif,.tiff,.heic,.heif,.svg,.docx,.xlsx,.pptx,.pdf,.csv,.txt,.md,.json,image/*" />
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
